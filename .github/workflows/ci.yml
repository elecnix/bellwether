name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job has timeout-minutes: 15. A passing job takes 2 minutes at most, so a hung one fails at 15 instead of at GitHub's 6-hour limit.
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fixtures name only public or synthetic providers and models. A failure prints a redacted
      # form of the value, because this log is public.
      - name: fixture identifiers
        run: npm run check:fixtures
      - name: tier 1 unit tests
        run: npm run test:unit
      - name: tier 2 integration tests
        run: npm run test:integration
      # Tier 3 needs a real herdr server, which the runners don't have. The lab
      # skips itself when herdr is absent, so the runner stays green, and it
      # exercises the real server on a workstation.
      - name: tier 3 lab tests
        run: npm run test:lab

  prose:
    name: prose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      # Vale 3.20.0, the version the dotfiles pin, checked against the digest
      # of the release archive.
      - name: install vale
        env:
          VALE_VERSION: 3.20.0
          VALE_SHA256: f59e7030c5d4ace6cf915497d0d076a1699d61e876142765963237e6867c9712
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/$archive"
          echo "$VALE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: fetch the rule packages
        run: vale sync
      # README.md, AGENTS.md and every page under docs/, with .vale.ini as it
      # stands. A warning fails the job, as it fails the pr-body check.
      - name: lint the prose
        run: npm run check:prose
      # Fails when Vale did not read a tracked page under docs/, so a page
      # added later cannot fall outside the lint.
      - name: check that vale read every page
        run: npm run check:prose-coverage
