# Prose rules for every Markdown file, PR body and review in this repo.
# `vale sync` fetches the pinned ai-tells packages into StylesPath.
# The noslop rules come from elecnix/cc-noslop.
StylesPath = .github/vale/styles
Vocab = Bellwether
MinAlertLevel = warning

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells-experimental.zip

[*.md]
# An agent signs a pull request body on a line of its own: an em dash, its
# name linked to its avatar or to the extension that mints the name, and a
# robot after an extension link. EmDashUsage rejects that em dash, so ignore
# the whole signature line and nothing else. The line must start with the em
# dash and end after the link, so prose on the same line keeps its check.
# The SIGNATURE_CASES in scripts/prose.ts hold this rule to both halves.
TokenIgnores = (?m)^— \[[^\]\n]+\]\(<?https://(app\.avatar-maker\.workers\.dev/avatar/[^\s>)]+|github\.com/elecnix/pi-agent-(identity|name))>?\)( 🤖)?\r?$
BasedOnStyles = ai-tells, ai-tells-experimental, noslop
