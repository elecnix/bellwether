# Prose rules for every Markdown file, PR body and review in this repo.
# `vale sync` fetches the pinned ai-tells packages into StylesPath.
# The noslop rules come from elecnix/cc-noslop.
StylesPath = .github/vale/styles
Vocab = Bellwether
MinAlertLevel = warning

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.34.0/ai-tells-experimental.zip

[*.md]
# The agent signature each agent appends to a pull request body uses an em
# dash, which EmDashUsage rejects. The signature is fixed, so ignore it.
TokenIgnores = (—[^\n]*pi-agent-identity)
BasedOnStyles = ai-tells, ai-tells-experimental, noslop
