<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<script>try { const t = localStorage.getItem('bellwether-docs-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
/*REPORT-PAGE-CSS*/

/* ---- documentation site, on top of report-page.css ---- */
.skip { position: absolute; left: -9999px; top: 12px; z-index: 100; padding: 8px 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.skip:focus { left: 16px; }
h1, h2, h3, h4 { scroll-margin-top: 16px; }
.byline a { color: var(--muted); }
.byline a:hover { color: var(--ink); }
pre, code { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
pre { margin: 12px 0; padding: 12px 16px; overflow-x: auto; line-height: 1.5; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
pre code { padding: 0; border: 0; white-space: pre; overflow-wrap: normal; }
ol, ul { padding-left: 1.4em; }
li + li { margin-top: 4px; }
.rail nav a[aria-current="page"] { color: var(--ink); }
.rail nav li + li { margin-top: 0; }
/* On a phone a wide table keeps readable columns and scrolls sideways in its wrapper. */
@media (max-width: 760px) { .table-wrap table { min-width: 640px; } }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the content</a>
<div class="wrap">
  <aside class="rail" id="rail" data-open="true">
    <div class="railhead">
      <p class="id">Contents</p>
      <span class="railbtns">
        <button class="iconbtn iconbtn--theme" id="themebtn" type="button" aria-label="Switch to the dark theme" title="Switch to the dark theme">
          <svg class="ic-auto" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path class="ic-fill" d="M8 2.25a5.75 5.75 0 0 1 0 11.5Z"/></svg>
          <svg class="ic-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"/></svg>
          <svg class="ic-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.9"/><path d="M8 1v1.9M8 13.1V15M1 8h1.9M13.1 8H15M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/></svg>
        </button>
        <button class="iconbtn iconbtn--contents" id="railtoggle" type="button" aria-expanded="true" aria-controls="railnav" aria-label="Hide contents" title="Hide contents">
          <svg class="ic-open" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
          <svg class="ic-closed" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg>
        </button>
      </span>
    </div>
    <nav id="railnav" aria-label="Pages and the sections of this page">
      <ol>
{{nav}}
      </ol>
    </nav>
  </aside>
  <script>
  (() => {
    const root = document.documentElement;
    const rail = document.getElementById('rail');
    const toggle = document.getElementById('railtoggle');
    const themebtn = document.getElementById('themebtn');
    const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const put = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

    // The glyph shows the state; the label says what a click does.
    const NEXT = { auto: 'dark', dark: 'light', light: 'auto' };
    const ACTION = { auto: 'Switch to the dark theme', dark: 'Switch to the light theme', light: 'Follow the browser theme' };
    const showTheme = () => {
      const t = root.dataset.theme || 'auto';
      themebtn.setAttribute('aria-label', ACTION[t]);
      themebtn.title = ACTION[t];
    };
    themebtn.addEventListener('click', () => {
      const t = NEXT[root.dataset.theme || 'auto'];
      if (t === 'auto') { delete root.dataset.theme; put('bellwether-docs-theme', null); }
      else { root.dataset.theme = t; put('bellwether-docs-theme', t); }
      showTheme();
    });
    showTheme();

    const setOpen = (open, remember) => {
      rail.dataset.open = String(open);
      toggle.setAttribute('aria-expanded', String(open));
      const label = open ? 'Hide contents' : 'Show contents';
      toggle.setAttribute('aria-label', label);
      toggle.title = label;
      if (remember) put('bellwether-docs-rail', String(open));
    };
    toggle.addEventListener('click', () => setOpen(rail.dataset.open === 'false', true));
    const saved = get('bellwether-docs-rail');
    setOpen(saved === null ? innerWidth >= 1080 : saved === 'true', false);

    // Mark the section being read: the last heading above a third of the viewport.
    addEventListener('DOMContentLoaded', () => {
      const links = [...rail.querySelectorAll('a.sub')];
      const targets = links.map((a) => document.getElementById(decodeURIComponent(a.hash.slice(1))));
      let queued = false;
      const mark = () => {
        queued = false;
        let current = -1;
        targets.forEach((h, i) => { if (h && h.getBoundingClientRect().top <= innerHeight / 3) current = i; });
        links.forEach((a, i) => a.classList.toggle('on', i === current));
      };
      addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(mark); } }, { passive: true });
      mark();
    });
  })();
  </script>
  <main id="content" tabindex="-1">
{{content}}
  </main>
</div>
</body>
</html>
